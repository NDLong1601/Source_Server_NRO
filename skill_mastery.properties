# Skill mastery starts after the normal level-7 skill has been learned.
# point and skillId remain at level 7 so old clients reuse the level-7 effect.

# Uses required from level 7 -> 8. Every later level grows by this percentage.

# Client receives normalized progress 0..1000. A packet is sent each 10 points.

# Default combat growth for every skill after level 7.

