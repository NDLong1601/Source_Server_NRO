# Giai đoạn 5A: công tắc rollout độc lập. enabled=false chặn cả đọc và ghi;
# mutations_enabled=false giữ màn hình/snapshot đọc được nhưng chặn thay đổi tài sản/trạng thái.
territory.enabled=true
territory.mutations_enabled=true
treasury.enabled=true
treasury.mutations_enabled=true
tree.enabled=true
tree.mutations_enabled=true
progression.enabled=true
progression.mutations_enabled=true
shop.enabled=true
shop.mutations_enabled=true
gift.enabled=true
gift.mutations_enabled=true
item_storage.enabled=true
item_storage.mutations_enabled=true
buff.enabled=true
buff.mutations_enabled=true

# Giai đoạn 5B: tính và lưu Clan Value.
value.enabled=true
value.mutations_enabled=true

# Giai đoạn 5C: bảng xếp hạng chỉ đọc từ Clan Value đã materialize.
ranking.enabled=true
ranking.mutations_enabled=false

# Giai đoạn 5D: ngoại hình tự mở theo thành tích, không có mutation từ client.
appearance.enabled=true
appearance.mutations_enabled=false

# Giai đoạn 5E: metric tổng hợp và dashboard quản trị chỉ đọc.
economy_metrics.enabled=true
economy_metrics.mutations_enabled=false
