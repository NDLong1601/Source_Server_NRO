# Giai đoạn 5E: cửa sổ báo cáo, lưu giữ metric và ngưỡng cảnh báo cân bằng.
# Metric chỉ chứa số tổng hợp ngày và clan-day, không lưu ID/tên người chơi.
lookback_default_days=14
lookback_max_days=90
retention_days=180
flush_interval_seconds=15

# Tỷ lệ sink/source thấp hơn min: nguồn sinh dư; cao hơn max: nguy cơ thiếu hụt.
gold_sink_ratio_min_percent=70
gold_sink_ratio_max_percent=110
gem_sink_ratio_min_percent=50
gem_sink_ratio_max_percent=150
capsule_sink_ratio_min_percent=70
capsule_sink_ratio_max_percent=130
